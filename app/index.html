<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A lightweight, responsive, and accurate Unit Converter web application for Length, Weight, Temperature, Area, and Time. Runs 100% in the browser with zero dependencies.">
  <meta name="theme-color" content="#4f46e5">
  <title>Unit Converter - Fast &amp; Accurate Online Converter</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header Section -->
    <header class="app-header">
      <div class="theme-toggle-wrapper">
        <button type="button" id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle dark and light theme" title="Toggle theme">
          <!-- Moon Icon (for Light Mode) -->
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <!-- Sun Icon (for Dark Mode) -->
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
      <h1 class="app-title">Unit Converter</h1>
      <p class="app-subtitle">Convert units quickly and easily</p>
    </header>

    <!-- Category Selector Tabs -->
    <nav class="category-nav" role="tablist" aria-label="Conversion categories">
      <button type="button" class="category-btn active" role="tab" aria-selected="true" data-category="length" id="tab-length">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2 12h20M2 12l4-4M2 12l4 4M22 12l-4-4M22 12l4 4"></path>
        </svg>
        Length
      </button>
      <button type="button" class="category-btn" role="tab" aria-selected="false" data-category="weight" id="tab-weight">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v18M3 9l9-6 9 6M6 15l-3-6h6l-3 6a3 3 0 0 1-6 0zM18 15l-3-6h6l-3 6a3 3 0 0 1-6 0z"></path>
        </svg>
        Weight
      </button>
      <button type="button" class="category-btn" role="tab" aria-selected="false" data-category="temperature" id="tab-temperature">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"></path>
        </svg>
        Temperature
      </button>
      <button type="button" class="category-btn" role="tab" aria-selected="false" data-category="area" id="tab-area">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <path d="M3 9h18M9 21V9"></path>
        </svg>
        Area
      </button>
      <button type="button" class="category-btn" role="tab" aria-selected="false" data-category="time" id="tab-time">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        Time
      </button>
    </nav>

    <!-- Main Converter Card -->
    <main>
      <section class="converter-card" aria-label="Unit conversion calculator">
        <form id="converter-form" novalidate>
          <!-- Value Input Group -->
          <div class="form-group">
            <label for="value-input" class="form-label">Enter Value</label>
            <div class="input-wrapper">
              <input
                type="number"
                id="value-input"
                name="value"
                class="text-input"
                placeholder="e.g. 100"
                step="any"
                required
                autocomplete="off"
                aria-describedby="input-error"
              >
            </div>
            <div id="input-error" class="input-error" role="alert" aria-live="polite">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
              </svg>
              <span id="input-error-text">Please enter a value.</span>
            </div>
          </div>

          <!-- Unit Selection & Swap Row -->
          <div class="units-row">
            <!-- From Unit Selector -->
            <div class="unit-selector-col">
              <label for="from-unit-select" class="form-label">From</label>
              <div class="select-wrapper">
                <select id="from-unit-select" name="fromUnit" class="select-input" aria-label="From unit"></select>
                <span class="select-arrow" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </span>
              </div>
            </div>

            <!-- Swap Button -->
            <div class="swap-btn-col">
              <button type="button" id="swap-btn" class="swap-btn" aria-label="Swap From and To units" title="Swap units (⇄)">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M7 16V4M7 4L3 8M7 4L11 8M17 8V20M17 20L21 16M17 20L13 16"></path>
                </svg>
              </button>
            </div>

            <!-- To Unit Selector -->
            <div class="unit-selector-col">
              <label for="to-unit-select" class="form-label">To</label>
              <div class="select-wrapper">
                <select id="to-unit-select" name="toUnit" class="select-input" aria-label="To unit"></select>
                <span class="select-arrow" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </span>
              </div>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="actions-row">
            <button type="submit" id="convert-btn" class="btn btn-primary">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" aria-hidden="true">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              Convert
            </button>
            <button type="button" id="reset-btn" class="btn btn-secondary">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
              </svg>
              Reset
            </button>
          </div>

          <!-- Result Display Box -->
          <div id="result-container" class="result-container" role="region" aria-live="polite">
            <div class="result-header">
              <span class="result-label">Result</span>
              <button type="button" id="copy-result-btn" class="copy-btn" aria-label="Copy result to clipboard" title="Copy result">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span id="copy-btn-text">Copy</span>
              </button>
            </div>
            <div id="result-main" class="result-main"></div>
            <div id="result-formula" class="result-formula"></div>
          </div>
        </form>
      </section>

      <!-- Recent Conversions Section -->
      <section class="history-section" aria-labelledby="history-heading">
        <div class="history-header">
          <h2 id="history-heading" class="history-title">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 14 14"></polyline>
            </svg>
            Recent Conversions
          </h2>
          <button type="button" id="clear-history-btn" class="clear-history-btn">Clear History</button>
        </div>
        <ul id="history-list" class="history-list">
          <li class="history-empty">No recent conversions.</li>
        </ul>
      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Unit Converter &bull; Runs 100% locally in your browser &bull; DevOps &amp; Nginx Ready</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
